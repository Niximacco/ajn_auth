{{define "content"}}
<main>
  {{if and .SiteName (not .SignedIn)}}<span class="site-mark"><i class="ico fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>{{.SiteName}}</span>{{end}}
  <h1>{{.Title}}</h1>
  {{if .Error}}<div class="banner"><i class="ico fa-solid fa-circle-exclamation" aria-hidden="true"></i><span>{{.Error}}</span></div>{{end}}
  {{if .Message}}<p>{{.Message}}</p>{{end}}
  {{if .SignedIn}}
    <form method="get" action="/admin"><button class="block" type="submit"><i class="ico fa-solid fa-layer-group" aria-hidden="true"></i>Back to the sites</button></form>
  {{else if .SiteURL}}
    <!-- A person here has a broken link and no session. The only thing worth
         offering is the way back to the site they were trying to reach, where
         asking for a new link is one form. -->
    <form method="get" action="{{.SiteURL}}"><button class="block" type="submit"><i class="ico fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>Back to {{.SiteName}}</button></form>
  {{end}}
</main>
{{end}}
