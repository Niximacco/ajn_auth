{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131a" media="(prefers-color-scheme: dark)">
<title>{{.Title}} &middot; {{if .SiteName}}{{.SiteName}}{{else}}{{.ServiceName}}{{end}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%91%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="{{.Stylesheet}}">
{{if .Accent}}
  <!-- The confirm page wears the colours of the site being signed in to. Only
       the accent moves: the surfaces, the type and the spacing stay as they
       are, so a site's brand colour cannot make this page unreadable. -->
  <style>:root { --accent: {{.Accent}}; --accent-hover: {{.Accent}}; }</style>
{{end}}
{{if .FontAwesomeKit}}
  <!-- The icons. Everything on these pages is labelled in words as well, so a
       kit that is not configured, blocked, or simply slow leaves a page with
       no icons on it rather than a page with holes in it. -->
  <link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
  <script src="https://kit.fontawesome.com/{{.FontAwesomeKit}}.js" crossorigin="anonymous" defer></script>
{{end}}
</head>
<body class="{{if not .SignedIn}}centred{{end}}">
{{if .SignedIn}}
<div class="bar">
  <nav>
    <a class="brand" href="/admin">
      <i class="ico fa-solid fa-key ico-accent" aria-hidden="true"></i>{{.ServiceName}}
    </a>
    <a href="/admin" class="tab {{if eq .Nav "sites"}}on{{end}}"><i class="ico fa-solid fa-layer-group" aria-hidden="true"></i>Sites</a>
    <span class="spacer"></span>
    <span class="who" title="{{.Email}}"><i class="ico fa-solid fa-circle-user" aria-hidden="true"></i>{{accountName .Email}}</span>
    <form method="post" action="/admin/logout">
      <button class="link" type="submit"><i class="ico fa-solid fa-right-from-bracket" aria-hidden="true"></i>Sign out</button>
    </form>
  </nav>
</div>
{{end}}
{{template "content" .}}
</body>
</html>{{end}}
